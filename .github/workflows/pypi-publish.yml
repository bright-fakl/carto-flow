name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to (pypi or testpypi)'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read
  id-token: write  # OIDC for trusted publishing

jobs:
  determine-target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      publish_url: ${{ steps.target.outputs.publish_url }}
    steps:
      # Compute the target once, here, rather than repeating the same
      # release/prerelease/dispatch ternary in every downstream field.
      #
      # - workflow_dispatch: honor the `environment` input exactly as before.
      # - release, prerelease == true (e.g. an -rc tag): TestPyPI. A
      #   prerelease is published automatically by GitHub firing
      #   `release: published`, and TestPyPI is the only safe automatic
      #   target since a real PyPI upload of a given version can never be
      #   replaced.
      # - release, prerelease == false: real PyPI, as today.
      - name: Determine publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tested against "false" rather than "true" so that the default is
            # TestPyPI. Anything unexpected - a missing or renamed payload
            # field, an empty expansion - then routes to TestPyPI, where a
            # wrong upload is recoverable. The reverse default would send a
            # release candidate to real PyPI, where a version can never be
            # replaced, which is the failure this job exists to prevent.
            if [ "${{ github.event.release.prerelease }}" = "false" ]; then
              environment=pypi
            else
              environment=testpypi
            fi
          else
            environment="${{ inputs.environment }}"
          fi

          if [ "$environment" = "testpypi" ]; then
            publish_url=https://test.pypi.org/legacy/
          else
            publish_url=https://upload.pypi.org/legacy/
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "publish_url=$publish_url" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: determine-target
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-target.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install build dependencies
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Publish package
        env:
          UV_PUBLISH_URL: ${{ needs.determine-target.outputs.publish_url }}
        run: uv publish --trusted-publishing always
